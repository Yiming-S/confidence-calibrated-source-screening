name: Verify public repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-figures.txt
            requirements-verification.txt

      - name: Install verification and regression-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-verification.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Kumar pipeline regression tests
        working-directory: analysis/kumar2024
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Verify released results
        run: |
          python scripts/verify_results.py
          python scripts/verify_revision_results.py

      - name: Rebuild reproducible figures
        run: python scripts/rebuild_figures.py --output-dir /tmp/rebuilt-figures

      - name: Rebuild additional-comparison tables
        run: |
          python scripts/make_bspc_revision_tables.py --out-dir /tmp/rebuilt-tables
          python scripts/make_current_publication_artifacts.py --table-dir /tmp/rebuilt-tables --figure-dir /tmp/rebuilt-figures
